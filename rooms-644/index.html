</style></head><body><header class="bar"><b>muxterm <span>/ Rooms &amp; Inbox</span></b><small>Design mockups · Issue #644</small><button id="menu">Scenes</button></header><div class="grid"><nav class="contents" aria-label="Storyboard scenes"><section><h3>Join the room</h3><button data-i="0"><span>01</span>Enable the repository</button><button data-i="1"><span>02</span>Install the webhook</button><button data-i="2"><span>03</span>Share the join link</button><button data-i="3"><span>04</span>Maya joins from her phone</button></section><section><h3>Offer and decide</h3><button data-i="4"><span>05</span>Ken’s session offers Work</button><button data-i="5"><span>07</span>One Inbox across rooms</button><button data-i="6"><span>08</span>Turn a GitHub issue into local Work</button><button data-i="7"><span>09</span>Review the revision that changed</button><button data-i="8"><span>10</span>Accept revision 4 on this Mac</button><button data-i="9"><span>11</span>Decide at phone width</button><button data-i="10"><span>12</span>Confirm the GitHub label</button><button data-i="11"><span>13</span>Read acceptance on a phone</button><button data-i="12"><span>14</span>Observe from a second instance</button><button data-i="13"><span>15</span>Deny a separate offer</button><button data-i="14"><span>16</span>Authorize a local acceptance rule</button><button data-i="15"><span>17</span>Inspect an automated acceptance</button></section><section><h3>Do the work</h3><button data-i="16"><span>18</span>Acceptance waits for the scheduler</button><button data-i="17"><span>19</span>See all local scheduling constraints</button><button data-i="18"><span>20</span>Report progress in ordinary Work</button><button data-i="19"><span>21</span>Handle a blocker and a comment</button><button data-i="20"><span>22</span>Review the evidence</button><button data-i="21"><span>23</span>See the latest outcome in Rooms</button><button data-i="22"><span>24</span>Read the outcome in the originating room</button><button data-i="23"><span>25</span>Read the room outcome on a phone</button><button data-i="24"><span>26</span>Return to the requesting session</button><button data-i="25"><span>27</span>Link ordinary issues to local work</button></section><section><h3>Exceptions and recovery</h3><button data-i="26"><span>28</span>Keep a local acceptance on a sync failure</button><button data-i="27"><span>29</span>Catch up after a missed delivery</button><button data-i="28"><span>30</span>Recover after reconnecting</button><button data-i="29"><span>31</span>An issue closes during a run</button><button data-i="30"><span>32</span>Reconcile a withdrawn offer</button><button data-i="31"><span>33</span>Explain a lost room subscription</button><button data-i="32"><span>34</span>Handle an inaccessible join link</button><button data-i="33"><span>35</span>Maintain the webhook</button></section></nav><main><div class="meta"><span id="chapter"></span><span id="actor"></span></div><h1></h1><p id="caption"></p><div class="canvas"><img id="shot" alt=""></div><div class="bottom"><a class="png" href="#">Open full-size screenshot</a><button id="prev">← Previous</button><button id="next">Next →</button></div></main></div><script type="application/json" id="data">[{"key": "01-setup", "chapter": "Join the room", "name": "Enable the repository", "caption": "Ken starts from a private GitHub repository he administers. The relay uses a manually installed repository webhook.", "actor": "Ken \u00b7 room admin", "mobile": false, "frame": 1}, {"key": "02-webhook", "chapter": "Join the room", "name": "Install the webhook", "caption": "Ken copies the per-repository URL and secret, selects the two event types, and waits for GitHub\u2019s signed setup ping.", "actor": "Ken \u00b7 room admin", "mobile": false, "frame": 2}, {"key": "03-connected", "chapter": "Join the room", "name": "Share the join link", "caption": "The signed ping has arrived. Ken can send one join link to collaborators. Room membership follows repository access.", "actor": "Ken \u00b7 room admin", "mobile": false, "frame": 3}, {"key": "04-join", "chapter": "Join the room", "name": "Maya joins from her phone", "caption": "The join link opens before Maya has a local project for this request. GitHub identifies her and muxterm binds this room to her instance.", "actor": "Maya \u00b7 phone", "mobile": true, "frame": 4}, {"key": "05-offer-chat", "chapter": "Offer and decide", "name": "Ken\u2019s session offers Work", "caption": "The creating session files a native Work item and addresses it to Maya in the room. It stays out of Ken\u2019s runnable queue.", "actor": "Ken \u00b7 creating session", "mobile": false, "frame": 5}, {"key": "07-inbox", "chapter": "Offer and decide", "name": "One Inbox across rooms", "caption": "Maya sees offers from multiple subscribed repositories, including an ordinary human-authored GitHub issue. None has started locally.", "actor": "Maya \u00b7 personal Inbox", "mobile": false, "frame": 7}, {"key": "07b-native-issue", "chapter": "Offer and decide", "name": "Turn a GitHub issue into local Work", "caption": "Maya opens a human-authored issue from the shared channel. She can accept it into existing Work or file a new item without inventing a requesting session.", "actor": "Maya \u00b7 personal Inbox", "mobile": false, "frame": 8}, {"key": "08-stale", "chapter": "Offer and decide", "name": "Review the revision that changed", "caption": "Maya had revision 3 open. Ken added the lid-close requirement, so Maya sees the difference before accepting revision 4.", "actor": "Maya \u00b7 personal Inbox", "mobile": false, "frame": 9}, {"key": "09-accept", "chapter": "Offer and decide", "name": "Accept revision 4 on this Mac", "caption": "Maya reads the full brief, chooses a local project, and accepts on her own machine. The project name belongs to Maya.", "actor": "Maya \u00b7 local decision", "mobile": false, "frame": 10}, {"key": "10-phone-accept", "chapter": "Offer and decide", "name": "Decide at phone width", "caption": "The phone view preserves the revision, destination, and two intake decisions. The linked Mac supplies the execution resources.", "actor": "Maya \u00b7 phone", "mobile": true, "frame": 11}, {"key": "11-label", "chapter": "Offer and decide", "name": "Confirm the GitHub label", "caption": "After acceptance, the issue shows muxterm:accepted alongside its existing labels. This muxterm issue preview shows the confirmed state from GitHub.", "actor": "Maya \u00b7 GitHub issue preview", "mobile": false, "frame": 12}, {"key": "11b-label-phone", "chapter": "Offer and decide", "name": "Read acceptance on a phone", "caption": "Maya sees confirmation of the published GitHub label and the accepted Work revision without opening her worker session.", "actor": "Maya \u00b7 phone", "mobile": true, "frame": 13}, {"key": "12-other-instance", "chapter": "Offer and decide", "name": "Observe from a second instance", "caption": "Maya\u2019s Linux instance receives the same label event. It shows where Maya accepted and where to look for the run.", "actor": "Maya \u00b7 second instance", "mobile": false, "frame": 14}, {"key": "13-deny", "chapter": "Offer and decide", "name": "Deny a separate offer", "caption": "Maya denies the shortcut review. Jo\u2019s requesting session receives the attributed decision and the fresh offer has no acceptance label.", "actor": "Maya \u00b7 phone", "mobile": true, "frame": 15}, {"key": "14-auto-rule", "chapter": "Offer and decide", "name": "Authorize a local acceptance rule", "caption": "Maya opts in to auto-accept only matching offers. Her rule owns the destination, and each decision records its name and owner.", "actor": "Maya \u00b7 local Jobs", "mobile": false, "frame": 16}, {"key": "14b-rule-result", "chapter": "Offer and decide", "name": "Inspect an automated acceptance", "caption": "Maya can identify the local rule that accepted the offer, the revision it accepted, and the destination selected for the job.", "actor": "Maya \u00b7 rule receipt", "mobile": false, "frame": 17}, {"key": "15-paused", "chapter": "Do the work", "name": "Acceptance waits for the scheduler", "caption": "Maya accepted Work #12 while her project was paused. She can see both the acceptance and why execution has not begun.", "actor": "Maya \u00b7 project Work", "mobile": false, "frame": 18}, {"key": "15b-held", "chapter": "Do the work", "name": "See all local scheduling constraints", "caption": "The project is playing at capacity. Separate rows explain a dependency and a human hold, each of which is respected after acceptance.", "actor": "Maya \u00b7 scheduler", "mobile": false, "frame": 19}, {"key": "16-plan", "chapter": "Do the work", "name": "Report progress in ordinary Work", "caption": "After the project resumes, Maya\u2019s worker uses the existing plan and status controls. Ken can follow the same milestones.", "actor": "Maya \u00b7 executing session", "mobile": false, "frame": 20}, {"key": "17-blocked-comment", "chapter": "Do the work", "name": "Handle a blocker and a comment", "caption": "Ken supplies the requested patch reference in GitHub. The owner reads the imported comment, acknowledges it, and can resume work.", "actor": "Maya \u00b7 activity", "mobile": false, "frame": 21}, {"key": "18-review", "chapter": "Do the work", "name": "Review the evidence", "caption": "Maya\u2019s worker completes the plan and submits the item for review. The shared artifact identifies the build and the observed result.", "actor": "Maya \u00b7 reviewer view", "mobile": false, "frame": 22}, {"key": "18b-rooms-latest", "chapter": "Do the work", "name": "See the latest outcome in Rooms", "caption": "Jo opens Rooms and sees what Maya verified in Release testing, without opening the issue or either participant\u2019s private chat.", "actor": "Jo \u00b7 room member", "mobile": false, "frame": 23}, {"key": "18c-room-outcomes", "chapter": "Do the work", "name": "Read the outcome in the originating room", "caption": "The room keeps the outcome with the Work item, reporting session, source issue, and evidence. Any authorized member can read it after reconnecting.", "actor": "Jo \u00b7 room member", "mobile": false, "frame": 24}, {"key": "18d-phone-room-outcomes", "chapter": "Do the work", "name": "Read the room outcome on a phone", "caption": "An authorized member can read the result and follow the evidence from Rooms at phone width.", "actor": "Jo \u00b7 phone", "mobile": true, "frame": 25}, {"key": "19-result-chat", "chapter": "Do the work", "name": "Return to the requesting session", "caption": "Ken opens his original chat after being offline. The worker\u2019s result arrives with its evidence; his larger investigation stays open.", "actor": "Ken \u00b7 originating chat", "mobile": false, "frame": 26}, {"key": "20-linked", "chapter": "Do the work", "name": "Link ordinary issues to local work", "caption": "Jo filed an ordinary issue in GitHub. Maya accepted the Mac check and denied the Windows offer. The issue-level acceptance label summarizes the individual records.", "actor": "Maya \u00b7 issue preview", "mobile": false, "frame": 27}, {"key": "21-permission", "chapter": "Exceptions and recovery", "name": "Keep a local acceptance on a sync failure", "caption": "If Maya lacks label permission, her acceptance remains recorded. Retrying publication sends the label update without repeating the local action.", "actor": "Maya \u00b7 permission branch", "mobile": false, "frame": 28}, {"key": "22-offline", "chapter": "Exceptions and recovery", "name": "Catch up after a missed delivery", "caption": "The cached Inbox opens immediately after Ken reconnects. Muxterm displays a retry time when GitHub throttles catch-up and preserves pending publication.", "actor": "Ken \u00b7 recovery", "mobile": false, "frame": 29}, {"key": "22b-synced", "chapter": "Exceptions and recovery", "name": "Recover after reconnecting", "caption": "Ken\u2019s instance has fetched the latest GitHub state after the backoff. Two deliveries of the same result are represented once in the Work history.", "actor": "Ken \u00b7 recovered state", "mobile": false, "frame": 30}, {"key": "23-closed", "chapter": "Exceptions and recovery", "name": "An issue closes during a run", "caption": "The linked PR closes the GitHub issue. The executing session can finish its local verification and return evidence.", "actor": "Maya \u00b7 execution branch", "mobile": false, "frame": 31}, {"key": "24-reassigned", "chapter": "Exceptions and recovery", "name": "Reconcile a withdrawn offer", "caption": "An offer was reassigned upstream before Maya accepted. The cached card directs her back to Inbox and records why her decision is no longer available.", "actor": "Maya \u00b7 phone", "mobile": true, "frame": 32}, {"key": "25-access", "chapter": "Exceptions and recovery", "name": "Explain a lost room subscription", "caption": "GitHub no longer grants this account access. Muxterm stops live delivery and gives Maya a way to check access.", "actor": "Maya \u00b7 Rooms", "mobile": false, "frame": 33}, {"key": "26-no-access", "chapter": "Exceptions and recovery", "name": "Handle an inaccessible join link", "caption": "A signed-in visitor without repository access sees a generic join failure. The relay reveals no offers, members, or issue details.", "actor": "Sam \u00b7 join link", "mobile": false, "frame": 34}, {"key": "27-admin", "chapter": "Exceptions and recovery", "name": "Maintain the webhook", "caption": "Ken can inspect a renamed repository, recover from a signature failure, rotate the secret, or disable its registration.", "actor": "Ken \u00b7 room admin", "mobile": false, "frame": 35}]</script><script>
const scenes=JSON.parse(document.querySelector('#data').textContent);let at=0;
const q=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
function show(i){at=Math.max(0,Math.min(i,scenes.length-1));const s=scenes[at];q('#chapter').textContent=s.chapter+'   /   '+'Frame '+String(s.frame).padStart(2,'0');q('#actor').textContent=s.actor;q('h1').textContent=s.name;q('#caption').textContent=s.caption;q('#shot').src='screens/'+s.key+'.png';q('#shot').alt=s.name+'. '+s.caption;q('.png').href=q('#shot').src;q('#prev').disabled=at===0;q('#next').disabled=at===scenes.length-1;all('[data-i]').forEach(b=>{b.classList.toggle('on',+b.dataset.i===at);b.setAttribute('aria-current',+b.dataset.i===at?'step':'false')});document.title=s.name+' · Rooms & Inbox';history.replaceState(null,'','#'+s.key);}
q('#prev').onclick=()=>show(at-1);q('#next').onclick=()=>show(at+1);q('#menu').onclick=()=>q('.contents').classList.toggle('open');all('[data-i]').forEach(b=>b.onclick=()=>{show(+b.dataset.i);q('.contents').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(at+1);if(e.key==='ArrowLeft')show(at-1)});show(Math.max(0,scenes.findIndex(s=>s.key===location.hash.slice(1))));
</script></body></html>
